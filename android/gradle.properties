# 注意：此处**不要**添加 -Djavax.net.ssl.trustStoreType=Windows-ROOT。
# 那是本机为绕开 TLS 拦截代理而设的，写进入库文件会让 Linux CI 的 JVM
# 去加载不存在的 Windows-ROOT keystore，导致 Gradle 下载依赖时 SSL 握手失败、
# 构建以 "FAILURE: Build failed with an exception" 结束且看不到具体原因。
# 本地需要时由 .toolchain/env.sh 的 GRADLE_OPTS 注入即可。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
