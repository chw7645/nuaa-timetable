name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.10.0（需与 pubspec 版本一致）'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: build APK & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，但**不保证**有本项目所需的
      # platform 36 / build-tools 36.0.0 / NDK（flutter.ndkVersion）。
      # 缺组件时 Gradle 会尝试自动下载，而 GitHub runner 默认未接受 license，
      # 于是构建以 exit code 1 结束且看不到原因。这里显式安装并接受 license。
      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK=$SDK"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;28.2.13676358" 2>&1 | tail -6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # 单 ABI 包：绝大多数机型，体积约 22 MB。
      # 注意不能用 --split-per-abi：AGP 9 + Flutter 3.47 下其 arm64 产物会缺失
      # AndroidManifest.xml 与 resources.arsc，装不上。
      - name: Build arm64 APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/build.log; then
            # 把关键错误写进 annotation，否则 Actions 页面只有一个 exit code 1，
            # 而 job 日志需要仓库管理员权限才能下载。
            MSG=$(grep -A 8 -iE "What went wrong|FAILURE:" /tmp/build.log | head -30 \
                  | tr '\n' ' ' | cut -c1-1400)
            [ -z "$MSG" ] && MSG=$(tail -30 /tmp/build.log | tr '\n' ' ' | cut -c1-1400)
            echo "::error title=arm64 build failed::${MSG}"
            exit 1
          fi
          mv build/app/outputs/flutter-apk/app-release.apk nuaa_timetable-arm64.apk

      - name: Build universal APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee /tmp/build2.log; then
            MSG=$(grep -A 8 -iE "What went wrong|FAILURE:" /tmp/build2.log | head -30 \
                  | tr '\n' ' ' | cut -c1-1400)
            [ -z "$MSG" ] && MSG=$(tail -30 /tmp/build2.log | tr '\n' ' ' | cut -c1-1400)
            echo "::error title=universal build failed::${MSG}"
            exit 1
          fi
          mv build/app/outputs/flutter-apk/app-release.apk nuaa_timetable-universal.apk

      - name: Verify APK integrity
        run: |
          for f in nuaa_timetable-arm64.apk nuaa_timetable-universal.apk; do
            n=$(unzip -l "$f" | grep -cE "AndroidManifest.xml|resources.arsc")
            echo "$f manifest+arsc=$n"
            test "$n" -eq 2 || exit 1
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            南航课程表 ${{ github.event.inputs.tag || github.ref_name }}

            - `nuaa_timetable-arm64.apk`：单 ABI，约 22 MB，绝大多数机型适用
            - `nuaa_timetable-universal.apk`：含全部 ABI，约 56 MB

            > 非官方客户端，仅供学习交流。安装前请先卸载旧版（签名不同），
            > 卸载会清除本机保存的学号、密码与课表缓存。
          files: |
            nuaa_timetable-arm64.apk
            nuaa_timetable-universal.apk
